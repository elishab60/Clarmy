services:
  # Long-lived daemon that owns the SessionManager and all PTYs. Survives app
  # rebuilds: `docker compose up -d --build cockpit` recreates only the app, so
  # running sessions here keep their live processes (no resume needed).
  orchestrator:
    build:
      context: .
      target: prod
    container_name: cockpit-orchestrator
    command: ["pnpm", "start:orchestrator"]
    environment:
      COCKPIT_ROLE: orchestrator
      COCKPIT_ORCHESTRATOR_PORT: "4010"
      COCKPIT_MOCK: "${COCKPIT_MOCK:-0}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_CLI_PATH: /usr/local/bin/claude
      CODEX_CLI_PATH: /usr/local/bin/codex
      GEMINI_CLI_PATH: /usr/local/bin/gemini
      # The container runs as root; the CLI blocks --dangerously-skip-permissions
      # under root unless it knows it is sandboxed. The container is the sandbox.
      IS_SANDBOX: "1"
      NODE_ENV: production
      HOME: /root
      CODEX_HOME: "${HOME}/.codex"
    expose:
      - "4010"
    volumes:
      - ${HOME}/.claude:/root/.claude
      # Gemini auth/config lives at homedir()/.gemini; HOME is /root in-container
      # so the spawned gemini CLI finds its oauth creds. (codex uses CODEX_HOME.)
      - ${HOME}/.gemini:/root/.gemini
      # Read-only seed: copied to a container-local /root/.claude.json at boot
      # (see docker-entrypoint.sh) to avoid torn reads of the shared file.
      - ${HOME}/.claude.json:/seed/.claude.json:ro
      - ${HOME}:${HOME}
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/ctl/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Next front-end. Stateless: proxies WS to the orchestrator and calls its
  # control API. Rebuild this freely without touching live sessions.
  cockpit:
    build:
      context: .
      target: prod
    container_name: cockpit
    command: ["pnpm", "start"]
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      COCKPIT_ROLE: app
      COCKPIT_PORT: "3010"
      COCKPIT_ORCHESTRATOR_URL: http://orchestrator:4010
      COCKPIT_MOCK: "${COCKPIT_MOCK:-0}"
      NODE_ENV: production
      HOME: /root
      # Codex usage gauge: ~/.codex is not under /root, but the host home is bind
      # mounted at its real path below, so point the reader at it.
      CODEX_HOME: "${HOME}/.codex"
    volumes:
      # Read-side: history/metrics/projects scan ~/.claude; git/fs APIs stat
      # project dirs under the host home. The app never spawns claude, so it
      # has no ~/.claude.json.
      - ${HOME}/.claude:/root/.claude
      # Gemini usage gauge reads homedir()/.gemini/telemetry.log; HOME is /root
      # in-container, so map the host ~/.gemini there explicitly (like .claude).
      - ${HOME}/.gemini:/root/.gemini
      - ${HOME}:${HOME}
    working_dir: /app
    restart: unless-stopped

  # Optional single-process dev with HMR: `docker compose --profile dev up cockpit-dev`.
  # Solo role (Next + orchestrator together); sessions live here and restart
  # with the container. Slower first hit (compiles on demand) but live edits.
  cockpit-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: cockpit-dev
    ports:
      - "3010:3010"
    environment:
      COCKPIT_PORT: "3010"
      COCKPIT_MOCK: "${COCKPIT_MOCK:-0}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_CLI_PATH: /usr/local/bin/claude
      CODEX_CLI_PATH: /usr/local/bin/codex
      GEMINI_CLI_PATH: /usr/local/bin/gemini
      IS_SANDBOX: "1"
      HOME: /root
      CODEX_HOME: "${HOME}/.codex"
    volumes:
      - .:/app:cached
      - cockpit_node_modules:/app/node_modules
      - cockpit_next_cache:/app/.next
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.gemini:/root/.gemini
      - ${HOME}/.claude.json:/seed/.claude.json:ro
      - ${HOME}:${HOME}
    working_dir: /app
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  cockpit_node_modules:
  cockpit_next_cache:
