<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="Army of clawds typing frantically">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120908"/>
      <stop offset="100%" stop-color="#0a0605"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1a100d" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg2)"/>
  <rect width="1200" height="440" fill="url(#grid2)" opacity="0.5"/>

  <!-- floor -->
  <g stroke="#3a2418" stroke-width="1" opacity="0.55">
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="388" x2="1200" y2="388"/>
    <line x1="0" y1="416" x2="1200" y2="416"/>
  </g>

  <!-- ambient label -->
