      <animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/>
    </text>
    <text x="1180" y="28" text-anchor="end">THROUGHPUT ▞▞▞▞▞▞▞▞▞▞</text>
    <text x="1180" y="46" text-anchor="end" fill="#ff8a5b">TOKENS/s ∞</text>
  </g>

