<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" shape-rendering="crispEdges" role="img" aria-label="SLAVE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140a08"/>
      <stop offset="100%" stop-color="#0a0605"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1a100d" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.55"/>

  <!-- SLAVE pixel letters. 5x7 grid, pixel size 28. Total 812x196, starting at x=194, y=90 -->
  <g fill="#ff8a5b">
    <!-- S -->
    <g transform="translate(194 90)" opacity="0">
      <rect x="28" y="0" width="84" height="28"/>
      <rect x="0" y="28" width="28" height="28"/>
      <rect x="112" y="28" width="28" height="28"/>
      <rect x="0" y="56" width="28" height="28"/>
      <rect x="28" y="84" width="84" height="28"/>
      <rect x="112" y="112" width="28" height="28"/>
      <rect x="0" y="140" width="28" height="28"/>
      <rect x="112" y="140" width="28" height="28"/>
      <rect x="28" y="168" width="84" height="28"/>
      <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.88;0.92;1"
               dur="5s" repeatCount="indefinite" calcMode="discrete"/>
    </g>
    <!-- L -->
    <g transform="translate(362 90)" opacity="0">
      <rect x="0" y="0" width="28" height="168"/>
      <rect x="0" y="168" width="140" height="28"/>
      <animate attributeName="opacity" values="0;1;0;1;1" keyTimes="0;0.06;0.88;0.92;1"
               dur="5s" repeatCount="indefinite" calcMode="discrete"/>
    </g>
    <!-- A -->
    <g transform="translate(530 90)" opacity="0">
      <rect x="28" y="0" width="84" height="28"/>
      <rect x="0" y="28" width="28" height="168"/>
      <rect x="112" y="28" width="28" height="168"/>
      <rect x="28" y="84" width="84" height="28"/>
      <animate attributeName="opacity" values="0;1;0;1;1" keyTimes="0;0.12;0.88;0.92;1"
               dur="5s" repeatCount="indefinite" calcMode="discrete"/>
    </g>
    <!-- V -->
    <g transform="translate(698 90)" opacity="0">
      <rect x="0" y="0" width="28" height="140"/>
      <rect x="112" y="0" width="28" height="140"/>
      <rect x="28" y="140" width="28" height="28"/>
      <rect x="84" y="140" width="28" height="28"/>
      <rect x="56" y="168" width="28" height="28"/>
      <animate attributeName="opacity" values="0;1;0;1;1" keyTimes="0;0.18;0.88;0.92;1"
               dur="5s" repeatCount="indefinite" calcMode="discrete"/>
    </g>
    <!-- E -->
    <g transform="translate(866 90)" opacity="0">
      <rect x="0" y="0" width="140" height="28"/>
      <rect x="0" y="28" width="28" height="140"/>
      <rect x="0" y="84" width="112" height="28"/>
      <rect x="0" y="168" width="140" height="28"/>
      <animate attributeName="opacity" values="0;1;0;1;1" keyTimes="0;0.24;0.88;0.92;1"
               dur="5s" repeatCount="indefinite" calcMode="discrete"/>
    </g>
  </g>

  <!-- Scanline -->
  <rect x="100" y="80" width="1000" height="2" fill="#ff8a5b">
    <animate attributeName="y" values="80;80;290;290" keyTimes="0;0.3;0.9;1"
             dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.3;0.9;1"
             dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle + blinking cursor -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#c8a894">
    <text x="600" y="335" text-anchor="middle">// PILOT A SWARM OF CLAUDES · ONE COCKPIT · ZERO MERCY</text>
    <rect x="868" y="323" width="10" height="16" fill="#ff8a5b">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Status strip -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#6e4f40">
    <text x="100" y="368">[ uplink ] ok</text>
    <text x="280" y="368">[ reactor ] nominal</text>
    <text x="500" y="368">[ fleet ] ∞ clawds</text>
    <text x="740" y="368">[ mode ] operator</text>
    <text x="960" y="368">[ build ] 0.1.0</text>
    <circle cx="92" cy="365" r="3" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="#ff8a5b" stroke-width="2" fill="none" opacity="0.85">
    <path d="M20 20 h36 M20 20 v36"/>
    <path d="M1180 20 h-36 M1180 20 v36"/>
    <path d="M20 380 h36 M20 380 v-36"/>
    <path d="M1180 380 h-36 M1180 380 v-36"/>
  </g>
</svg>
